<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Hábitos</title>
    <style>
        :root {
            --bg-deep: #050508;
            --surface: #0f1017;
            --surface-hover: #171822;
            --border-glow: rgba(0, 123, 255, 0.3);
            --primary: #007bff;
            --primary-bright: #3b82f6;
            --text-main: #ffffff;
            --text-sub: #8a8f98;
            --success: #00ff88;
            --danger: #ff3366;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 123, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 123, 255, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        /* --- Cabeçalho Superior (Título + Botão de Início) --- */
        .app-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 25px;
            padding-top: 10px;
        }

        .start-date-btn {
            background: var(--surface);
            border: 1px solid rgba(0, 123, 255, 0.3);
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }

        .start-date-btn:hover {
            border-color: var(--primary);
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .start-date-btn span {
            color: var(--primary);
        }

        h1 {
            color: var(--text-main);
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(0, 123, 255, 0.4);
        }

        h1 span {
            color: var(--primary);
            text-shadow: 0 0 25px rgba(0, 123, 255, 0.6);
        }

        /* --- Barra de Navegação dos 7 Dias --- */
        .date-navigator {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            padding: 12px 8px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            margin-bottom: 25px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.03);
            color: var(--primary);
            border: 1px solid rgba(0, 123, 255, 0.3);
            border-radius: 12px;
            width: 38px;
            height: 38px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .nav-btn:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 15px var(--primary);
            transform: scale(1.05);
        }

        .days-container {
            display: flex;
            justify-content: space-around;
            flex: 1;
            margin: 0 4px;
            overflow-x: auto;
        }

        .day-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 2px;
            border-radius: 12px;
            min-width: 36px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .day-card:hover {
            background: var(--surface-hover);
        }

        .day-card .day-name {
            font-size: 0.65rem;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .day-card .day-number {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .day-card.active {
            background: linear-gradient(135deg, var(--primary), #0056b3);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.5);
        }

        .day-card.active .day-name {
            color: rgba(255, 255, 255, 0.9);
        }

        .day-card.active .day-number {
            color: #ffffff;
        }

        /* --- Área de Entrada --- */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"], input[type="number"] {
            flex: 1;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        input[type="text"]::placeholder, input[type="number"]::placeholder {
            color: var(--text-sub);
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.3), inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .add-btn {
            background: linear-gradient(135deg, var(--primary), #0056b3);
            color: #ffffff;
            border: none;
            padding: 0 22px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 123, 255, 0.4);
            flex-shrink: 0;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 123, 255, 0.6);
        }

        /* --- Lista de Hábitos --- */
        .habit-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            margin-bottom: 30px;
        }

        .habit-item {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 5px solid var(--primary);
            padding: 14px 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .habit-item:hover {
            border-color: rgba(0, 123, 255, 0.3);
            transform: translateX(4px);
        }

        .habit-content {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            cursor: pointer;
            word-break: break-word;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(0, 123, 255, 0.5);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: transparent;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .habit-content:hover .checkbox {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.4);
        }

        .habit-item.completed {
            background: rgba(0, 255, 136, 0.03);
            border-left-color: var(--success);
            opacity: 0.65;
        }

        .habit-item.completed .checkbox {
            background: var(--success);
            border-color: var(--success);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .habit-item.completed .habit-text {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .delete-btn {
            background: transparent;
            color: var(--text-sub);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background: rgba(255, 51, 102, 0.15);
            color: var(--danger);
        }

        /* --- Seção do Calendário Mensal --- */
        .month-calendar-section {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 24px;
            padding: 20px 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            font-size: 1.15rem;
            color: var(--text-main);
            font-weight: 700;
            margin: 0;
            text-transform: capitalize;
            letter-spacing: 0.5px;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            font-size: 0.7rem;
            color: var(--text-sub);
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            justify-items: center;
        }

        .month-day-cell {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease;
        }

        .month-day-cell:hover {
            transform: scale(1.1);
            border-color: var(--primary);
        }

        .month-day-inner {
            width: 30px;
            height: 30px;
            background-color: var(--surface);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            z-index: 2;
        }

        .month-day-cell.full-completed {
            background: var(--success) !important;
            border-color: var(--success);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .month-day-cell.full-completed .month-day-inner {
            background-color: var(--success);
            color: #050508;
        }

        .month-day-cell.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .month-day-cell.empty:hover {
            transform: none;
        }

        .month-day-cell.selected-day .month-day-inner {
            border: 2px solid var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        /* --- Retângulos de Estatísticas Responsivos --- */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        @media (max-width: 520px) {
            .stats-container {
                grid-template-columns: repeat(2, 1fr); /* 2 colunas no celular para não espremer */
            }
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 4px solid var(--primary);
            border-radius: 20px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 123, 255, 0.4);
        }

        .stat-icon {
            font-size: 1.2rem;
            margin-bottom: 6px;
            filter: drop-shadow(0 0 8px rgba(0, 123, 255, 0.4));
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* --- Modal de Data de Início --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--surface);
            border: 1px solid rgba(0, 123, 255, 0.4);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .modal-card h3 {
            margin-top: 0;
            margin-bottom: 18px;
            color: var(--text-main);
            font-size: 1.2rem;
        }

        .modal-inputs-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Cabeçalho com Botão e Título -->
        <div class="app-header">
            <button class="start-date-btn" id="startDateBtn" title="Alterar data de início">
                Início: <span id="startDateDisplay">--/--/----</span>
            </button>
            <h1>Habit <span>Tracker</span></h1>
        </div>

        <!-- Navegação dos 7 Dias -->
        <div class="date-navigator">
            <button class="nav-btn" id="prevDayBtn">&#10094;</button>
            <div class="days-container" id="daysContainer"></div>
            <button class="nav-btn" id="nextDayBtn">&#10095;</button>
        </div>

        <!-- Entrada de Novo Hábito -->
        <div class="input-group">
            <input type="text" id="habitInput" placeholder="Adicionar novo hábito...">
            <button class="add-btn" id="addBtn">Criar</button>
        </div>

        <!-- Lista de Hábitos -->
        <div id="habitList" class="habit-list"></div>

        <!-- Calendário Mensal -->
        <div class="month-calendar-section">
            <div class="calendar-header">
                <button class="nav-btn" id="prevMonthBtn">&#10094;</button>
                <h2 id="monthYearTitle"></h2>
                <button class="nav-btn" id="nextMonthBtn">&#10095;</button>
            </div>

            <div class="calendar-weekdays">
                <span>Dom</span><span>Seg</span><span>Ter</span>
                <span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
            </div>

            <div id="calendarGrid" class="calendar-grid"></div>
        </div>

        <!-- Retângulos de Estatísticas -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-value" id="dayStat">0%</div>
                <div class="stat-label">Hoje</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="weekStat">0%</div>
                <div class="stat-label">Semana</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-value" id="streakStat">0d</div>
                <div class="stat-label">Sequência</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">⚡</div>
                <div class="stat-value" id="totalDaysUsed">0d</div>
                <div class="stat-label">Uso Total</div>
            </div>
        </div>
    </div>

    <!-- Modal Personalizado para a Data de Início -->
    <div id="dateModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Definir Data de Início</h3>
            <div class="modal-inputs-stack">
                <input type="number" id="inputDay" placeholder="Dia (Ex: 01)" min="1" max="31">
                <input type="number" id="inputMonth" placeholder="Mês (Ex: 06)" min="1" max="12">
                <input type="number" id="inputYear" placeholder="Ano (Ex: 2026)" min="2000" max="2100">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelModalBtn">Cancelar</button>
                <button class="add-btn" id="saveDateModalBtn">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let viewMonthDate = new Date();
        
        let habits = [];
        let appStartDate = null;

        function saveAppData() {
            const dataToSave = {
                habits: habits,
                startDate: appStartDate ? appStartDate.toISOString() : null
            };
            localStorage.setItem('myHabitsAppData', JSON.stringify(dataToSave));
        }

        function loadAppData() {
            const savedData = localStorage.getItem('myHabitsAppData');
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    habits = parsed.habits || [];
                    appStartDate = parsed.startDate ? new Date(parsed.startDate) : null;
                } catch (e) {
                    habits = [];
                    appStartDate = null;
                }
            }

            if (!appStartDate) {
                appStartDate = new Date();
                saveAppData();
            }
        }

        const daysContainer = document.getElementById('daysContainer');
        const prevDayBtn = document.getElementById('prevDayBtn');
        const nextDayBtn = document.getElementById('nextDayBtn');
        const weekDays = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // --- Lógica do Modal de Data ---
        const startDateBtn = document.getElementById('startDateBtn');
        const dateModal = document.getElementById('dateModal');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const saveDateModalBtn = document.getElementById('saveDateModalBtn');
        
        const inputDay = document.getElementById('inputDay');
        const inputMonth = document.getElementById('inputMonth');
        const inputYear = document.getElementById('inputYear');

        startDateBtn.addEventListener('click', () => {
            if (appStartDate) {
                inputDay.value = appStartDate.getDate();
                inputMonth.value = appStartDate.getMonth() + 1;
                inputYear.value = appStartDate.getFullYear();
            }
            dateModal.classList.add('active');
        });

        cancelModalBtn.addEventListener('click', () => {
            dateModal.classList.remove('active');
        });

        saveDateModalBtn.addEventListener('click', () => {
            const d = parseInt(inputDay.value);
            const m = parseInt(inputMonth.value) - 1;
            const y = parseInt(inputYear.value);

            const testDate = new Date(y, m, d);

            if (!isNaN(testDate.getTime()) && d >= 1 && d <= 31 && m >= 0 && m <= 11 && y >= 2000) {
                appStartDate = testDate;
                saveAppData();
                dateModal.classList.remove('active');
                refreshApp();
            } else {
                alert("Por favor, insira uma data válida nos campos!");
            }
        });

        // --- Renderização da Barra Superior de 7 Dias ---
        function renderCalendar() {
            daysContainer.innerHTML = '';

            for (let i = -3; i <= 3; i++) {
                const dayDate = new Date(currentDate);
                dayDate.setDate(currentDate.getDate() + i);

                const dayCard = document.createElement('div');
                dayCard.classList.add('day-card');

                if (i === 0) {
                    dayCard.classList.add('active');
                }

                const dayName = weekDays[dayDate.getDay()];
                const dayNumber = dayDate.getDate();

                dayCard.innerHTML = `
                    <span class="day-name">${dayName}</span>
                    <span class="day-number">${dayNumber}</span>
                `;

                const targetDate = new Date(dayDate);
                dayCard.addEventListener('click', () => {
                    currentDate = targetDate;
                    viewMonthDate = new Date(targetDate);
                    refreshApp();
                });

                daysContainer.appendChild(dayCard);
            }
        }

        prevDayBtn.addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() - 1);
            viewMonthDate = new Date(currentDate);
            refreshApp();
        });

        nextDayBtn.addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() + 1);
            viewMonthDate = new Date(currentDate);
            refreshApp();
        });

        // --- Renderização dos Hábitos ---
        function renderHabits() {
            const habitList = document.getElementById('habitList');
            habitList.innerHTML = '';
            const currentKey = formatDateKey(currentDate);

            habits.forEach((habit, index) => {
                const habitItem = document.createElement('div');
                habitItem.classList.add('habit-item');

                const isCompleted = habit.completedDays && habit.completedDays[currentKey];
                if (isCompleted) {
                    habitItem.classList.add('completed');
                }

                habitItem.innerHTML = `
                    <div class="habit-content">
                        <div class="checkbox">✓</div>
                        <span class="habit-text">${habit.text}</span>
                    </div>
                    <button class="delete-btn">✕</button>
                `;

                const habitContent = habitItem.querySelector('.habit-content');
                habitContent.addEventListener('click', () => {
                    if (!habit.completedDays) {
                        habit.completedDays = {};
                    }
                    habit.completedDays[currentKey] = !habit.completedDays[currentKey];
                    saveAppData();
                    refreshApp();
                });

                const deleteBtn = habitItem.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    habits.splice(index, 1);
                    saveAppData();
                    refreshApp();
                });

                habitList.appendChild(habitItem);
            });
        }

        // --- Renderização do Calendário Mensal ---
        const monthYearTitle = document.getElementById('monthYearTitle');
        const calendarGrid = document.getElementById('calendarGrid');
        const prevMonthBtn = document.getElementById('prevMonthBtn');
        const nextMonthBtn = document.getElementById('nextMonthBtn');

        function renderMonthCalendar() {
            calendarGrid.innerHTML = '';

            const year = viewMonthDate.getFullYear();
            const month = viewMonthDate.getMonth();

            const monthName = viewMonthDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            monthYearTitle.textContent = monthName;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDaysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.classList.add('month-day-cell', 'empty');
                calendarGrid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDaysInMonth; day++) {
                const dayDate = new Date(year, month, day);
                const dayKey = formatDateKey(dayDate);

                let completedCount = 0;
                const totalHabits = habits.length;

                if (totalHabits > 0) {
                    habits.forEach(habit => {
                        if (habit.completedDays && habit.completedDays[dayKey]) {
                            completedCount++;
                        }
                    });
                }

                const percentage = totalHabits > 0 ? (completedCount / totalHabits) * 100 : 0;

                const dayCell = document.createElement('div');
                dayCell.classList.add('month-day-cell');

                if (percentage === 100 && totalHabits > 0) {
                    dayCell.classList.add('full-completed');
                } else if (percentage > 0) {
                    dayCell.style.background = `conic-gradient(#00ff88 ${percentage}%, rgba(255, 255, 255, 0.03) ${percentage}% 100%)`;
                } else {
                    dayCell.style.background = `rgba(255, 255, 255, 0.03)`;
                }

                if (dayKey === formatDateKey(currentDate)) {
                    dayCell.classList.add('selected-day');
                }

                dayCell.innerHTML = `<div class="month-day-inner">${day}</div>`;

                dayCell.addEventListener('click', () => {
                    currentDate = new Date(year, month, day);
                    refreshApp();
                });

                calendarGrid.appendChild(dayCell);
            }
        }

        prevMonthBtn.addEventListener('click', () => {
            viewMonthDate.setMonth(viewMonthDate.getMonth() - 1);
            renderMonthCalendar();
        });

        nextMonthBtn.addEventListener('click', () => {
            viewMonthDate.setMonth(viewMonthDate.getMonth() + 1);
            renderMonthCalendar();
        });

        // --- Cálculo e Atualização das Estatísticas ---
        function updateStats() {
            const dayStatEl = document.getElementById('dayStat');
            const weekStatEl = document.getElementById('weekStat');
            const streakStatEl = document.getElementById('streakStat');
            const totalDaysUsedEl = document.getElementById('totalDaysUsed');
            const startDateDisplay = document.getElementById('startDateDisplay');

            if (appStartDate) {
                startDateDisplay.textContent = appStartDate.toLocaleDateString('pt-BR');
                
                const today = new Date();
                today.setHours(0,0,0,0);
                const startDay = new Date(appStartDate);
                startDay.setHours(0,0,0,0);
                
                const diffTime = Math.abs(today - startDay);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                totalDaysUsedEl.textContent = `${diffDays}d`;
            }

            const totalHabits = habits.length;

            if (totalHabits === 0) {
                dayStatEl.textContent = '0%';
                weekStatEl.textContent = '0%';
                streakStatEl.textContent = '0d';
                return;
            }

            const currentKey = formatDateKey(currentDate);
            let dayCompleted = 0;
            habits.forEach(h => {
                if (h.completedDays && h.completedDays[currentKey]) dayCompleted++;
            });
            const dayPercent = Math.round((dayCompleted / totalHabits) * 100);
            dayStatEl.textContent = `${dayPercent}%`;

            let totalWeekPercentSum = 0;
            for (let i = 0; i < 7; i++) {
                const pastDate = new Date(currentDate);
                pastDate.setDate(currentDate.getDate() - i);
                const pastKey = formatDateKey(pastDate);

                let pastCompleted = 0;
                habits.forEach(h => {
                    if (h.completedDays && h.completedDays[pastKey]) pastCompleted++;
                });
                totalWeekPercentSum += (pastCompleted / totalHabits);
            }
            const weekPercent = Math.round((totalWeekPercentSum / 7) * 100);
            weekStatEl.textContent = `${weekPercent}%`;

            let streak = 0;
            let checkDate = new Date(currentDate);

            while (true) {
                const checkKey = formatDateKey(checkDate);
                let checkCompleted = 0;

                habits.forEach(h => {
                    if (h.completedDays && h.completedDays[checkKey]) checkCompleted++;
                });

                if (checkCompleted === totalHabits && totalHabits > 0) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }

            streakStatEl.textContent = `${streak}d`;
        }

        function refreshApp() {
            renderCalendar();
            renderHabits();
            renderMonthCalendar();
            updateStats();
        }

        const habitInput = document.getElementById('habitInput');
        const addBtn = document.getElementById('addBtn');

        addBtn.addEventListener('click', () => {
            const habitText = habitInput.value.trim();

            if (habitText !== "") {
                habits.push({
                    text: habitText,
                    completedDays: {}
                });

                saveAppData();
                habitInput.value = '';
                habitInput.focus();
                refreshApp();
            }
        });

        habitInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addBtn.click();
            }
        });

        loadAppData();
        refreshApp();
    </script>

</body>
</html>
