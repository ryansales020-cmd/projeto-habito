<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEHD - Monitoramento Exclusivo de Hábitos Diários</title>
  <style>
    /* Configurações de cores e estilo global */
    :root {
      --cor-fundo: #0d0d0d;        /* Preto escuro */
      --cor-cartao: #1a1a1a;       /* Preto um pouco mais claro */
      --cor-verde: #00f5d4;        /* Verde piscina */
      --cor-texto: #ffffff;        /* Texto branco */
      --cor-texto-secundario: #a0a0a0;
      --cor-remover: #ff5252;      /* Vermelho para apagar */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--cor-fundo);
      color: var(--cor-texto);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px 40px 16px;
    }

    /* Cabeçalho */
    header {
      width: 100%;
      max-width: 400px;
      text-align: center;
      margin-bottom: 25px;
      padding-top: 10px;
    }

    h1 {
      color: var(--cor-verde);
      font-size: 1.9rem;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    p.subtitulo {
      color: var(--cor-texto-secundario);
      font-size: 0.9rem;
    }

    /* Calendário Semanal (7 dias) */
    .container-calendario {
      width: 100%;
      max-width: 400px;
      background-color: var(--cor-cartao);
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 14px 10px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
    }

    .btn-seta {
      background: transparent;
      border: none;
      color: var(--cor-verde);
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 8px;
      transition: background-color 0.2s;
    }

    .btn-seta:hover {
      background-color: #252525;
    }

    .dias-semana {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex: 1;
      gap: 4px;
    }

    .dia-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 9px 5px;
      border-radius: 10px;
      cursor: pointer;
      flex: 1;
      transition: all 0.2s ease;
    }

    .dia-item .nome-dia {
      font-size: 0.65rem;
      color: var(--cor-texto-secundario);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .dia-item .num-dia {
      font-size: 0.95rem;
      font-weight: bold;
    }

    .dia-item.ativo {
      background-color: var(--cor-verde);
      color: #000;
    }

    .dia-item.ativo .nome-dia {
      color: #000;
      font-weight: 700;
    }

    /* Formulário para adicionar hábito */
    .form-habito {
      width: 100%;
      max-width: 400px;
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .form-habito input {
      flex: 1;
      background-color: var(--cor-cartao);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--cor-texto);
      font-size: 0.95rem;
      outline: none;
    }

    .form-habito input:focus {
      border-color: var(--cor-verde);
    }

    .form-habito button {
      background-color: var(--cor-verde);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Lista de hábitos */
    main {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 30px;
    }

    .cartao-habito {
      background-color: var(--cor-cartao);
      border: 1px solid #2a2a2a;
      border-left: 4px solid var(--cor-verde);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .info-habito h3 {
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .acoes-habito {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-concluir {
      width: 30px;
      height: 30px;
      border: 2px solid var(--cor-verde);
      border-radius: 50%;
      background: transparent;
      color: #000;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .cartao-habito.concluido {
      opacity: 0.6;
      border-left-color: #555;
    }

    .cartao-habito.concluido .info-habito h3 {
      text-decoration: line-through;
      color: var(--cor-texto-secundario);
    }

    .cartao-habito.concluido .btn-concluir {
      background-color: var(--cor-verde);
    }

    .btn-remover {
      background: none;
      border: none;
      color: var(--cor-texto-secundario);
      font-size: 1.15rem;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s ease;
    }

    .btn-remover:hover {
      color: var(--cor-remover);
    }

    .mensagem-vazia {
      text-align: center;
      color: var(--cor-texto-secundario);
      font-size: 0.9rem;
      margin: 15px 0;
    }

    /* Seção de Estatísticas (Grade 2x2 para acomodar 4 cartões perfeitamente) */
    .container-estatisticas {
      width: 100%;
      max-width: 400px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 35px;
    }

    .cartao-estatistica {
      background-color: var(--cor-cartao);
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cartao-estatistica span.rotulo {
      font-size: 0.68rem;
      color: var(--cor-texto-secundario);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cartao-estatistica span.valor {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--cor-verde);
    }

    /* Cabeçalhos Externos dos Gráficos */
    .cabecalho-externo {
      width: 100%;
      max-width: 400px;
      margin-bottom: 12px;
      text-align: center;
    }

    .cabecalho-externo-navegacao {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .titulo-secao {
      font-size: 0.9rem;
      color: var(--cor-verde);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }

    .subtitulo-secao {
      font-size: 0.8rem;
      color: var(--cor-texto-secundario);
      margin-top: 3px;
    }

    /* Seção do Calendário Mensal em Gráfico Circular */
    .secao-grafico-wrapper {
      width: 100%;
      max-width: 400px;
      margin-bottom: 35px;
    }

    .container-grafico-mes {
      width: 100%;
      background-color: var(--cor-cartao);
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 22px 18px;
    }

    .grade-mes {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px 10px;
      justify-items: center;
    }

    .circulo-dia {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease;
    }

    .circulo-dia:hover {
      transform: scale(1.12);
    }

    .circulo-dia-inner {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: var(--cor-cartao);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--cor-texto);
      transition: all 0.2s ease;
    }

    .circulo-dia.completo {
      background: var(--cor-verde) !important;
    }

    .circulo-dia.completo .circulo-dia-inner {
      background-color: var(--cor-verde);
      color: #000;
    }

    .circulo-dia.selecionado .circulo-dia-inner {
      box-shadow: 0 0 0 2px #fff;
    }

    /* Seção do Gráfico de Barras Semanal */
    .container-grafico-barras {
      width: 100%;
      background-color: var(--cor-cartao);
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 22px 18px;
    }

    .area-grafico-barras {
      display: flex;
      height: 180px;
      position: relative;
      align-items: flex-end;
      padding-left: 28px;
      padding-bottom: 25px;
    }

    .linhas-grade {
      position: absolute;
      left: 28px;
      right: 0;
      top: 0;
      bottom: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    .linha-grade {
      border-top: 1px dashed #333;
      width: 100%;
    }

    .eixo-y {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--cor-texto-secundario);
    }

    .grade-barras {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .coluna-barra-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      flex: 1;
    }

    .barra-cor {
      width: 22px;
      border-radius: 4px 4px 0 0;
      transition: height 0.3s ease;
      min-height: 2px;
    }

    .rotulo-data-barra {
      position: absolute;
      bottom: 0;
      font-size: 0.65rem;
      color: var(--cor-texto-secundario);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>MEHD</h1>
    <p class="subtitulo" id="textoDataAtual"></p>
  </header>

  <!-- Calendário Semanal (7 dias) -->
  <div class="container-calendario">
    <button class="btn-seta" id="btnAnterior" title="Dia Anterior">&#10094;</button>
    <div class="dias-semana" id="diasSemana"></div>
    <button class="btn-seta" id="btnProximo" title="Próximo Dia">&#10095;</button>
  </div>

  <!-- Formulário para adicionar hábito -->
  <form class="form-habito" id="formNovoHabito">
    <input 
      type="text" 
      id="inputNomeHabito" 
      placeholder="Digite um novo hábito..." 
      required
    >
    <button type="submit">+</button>
  </form>

  <!-- Lista de Hábitos -->
  <main id="listaHabitos">
    <p class="mensagem-vazia" id="mensagemVazia">Nenhum hábito cadastrado ainda.</p>
  </main>

  <!-- Estatísticas (Grade 2x2 com Hoje, Semana, Sequência e Na Plataforma) -->
  <div class="container-estatisticas">
    <div class="cartao-estatistica">
      <span class="rotulo">Hoje</span>
      <span class="valor" id="porcentagemDia">0%</span>
    </div>
    <div class="cartao-estatistica">
      <span class="rotulo">Semana</span>
      <span class="valor" id="porcentagemSemana">0%</span>
    </div>
    <div class="cartao-estatistica">
      <span class="rotulo">Sequência</span>
      <span class="valor" id="valorSequencia">0 dias</span>
    </div>
    <div class="cartao-estatistica">
      <span class="rotulo">Na Plataforma</span>
      <span class="valor" id="valorPlataforma">1 dia</span>
    </div>
  </div>

  <!-- Seção do Calendário Mensal em Gráfico Circular -->
  <div class="secao-grafico-wrapper">
    <div class="cabecalho-externo">
      <div class="titulo-secao">📊 Acompanhamento Mensal</div>
      <div class="subtitulo-secao" id="subtituloMesGrafico">Progresso do Mês</div>
    </div>
    <div class="container-grafico-mes">
      <div class="grade-mes" id="gradeMes"></div>
    </div>
  </div>

  <!-- Seção do Gráfico de Barras Semanal -->
  <div class="secao-grafico-wrapper">
    <div class="cabecalho-externo-navegacao">
      <button class="btn-seta" id="btnSemanaAnterior" title="Semana Anterior">&#10094;</button>
      <div style="text-align: center;">
        <div class="titulo-secao">📈 Hábitos por Dia</div>
        <div class="subtitulo-secao" id="subtituloSemanaGrafico">Semana Atual</div>
      </div>
      <button class="btn-seta" id="btnSemanaProxima" title="Próxima Semana">&#10095;</button>
    </div>

    <div class="container-grafico-barras">
      <div class="area-grafico-barras">
        <div class="eixo-y" id="eixoY">
          <span>0</span>
          <span>0</span>
          <span>0</span>
          <span>0</span>
        </div>

        <div class="linhas-grade">
          <div class="linha-grade"></div>
          <div class="linha-grade"></div>
          <div class="linha-grade"></div>
          <div class="linha-grade"></div>
        </div>

        <div class="grade-barras" id="gradeBarras"></div>
      </div>
    </div>
  </div>

  <script>
    const btnAnterior = document.getElementById('btnAnterior');
    const btnProximo = document.getElementById('btnProximo');
    const diasSemanaContainer = document.getElementById('diasSemana');
    const textoDataAtual = document.getElementById('textoDataAtual');
    const form = document.getElementById('formNovoHabito');
    const input = document.getElementById('inputNomeHabito');
    const lista = document.getElementById('listaHabitos');
    const mensagemVazia = document.getElementById('mensagemVazia');
    const spanPorcentagemDia = document.getElementById('porcentagemDia');
    const spanPorcentagemSemana = document.getElementById('porcentagemSemana');
    const spanValorSequencia = document.getElementById('valorSequencia');
    const spanValorPlataforma = document.getElementById('valorPlataforma');
    const gradeMes = document.getElementById('gradeMes');
    const subtituloMesGrafico = document.getElementById('subtituloMesGrafico');

    const btnSemanaAnterior = document.getElementById('btnSemanaAnterior');
    const btnSemanaProxima = document.getElementById('btnSemanaProxima');
    const subtituloSemanaGrafico = document.getElementById('subtituloSemanaGrafico');
    const gradeBarras = document.getElementById('gradeBarras');
    const eixoY = document.getElementById('eixoY');

    let habitos = JSON.parse(localStorage.getItem('app_habitos') || '[]');
    let historico = JSON.parse(localStorage.getItem('app_historico') || '{}');

    let dataCentral = new Date();
    let dataCentralSemanaBarras = new Date();

    const nomesDias = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
    const coresBarras = ['#aacc00', '#4cc9f0', '#1d3557', '#f72585', '#ffb703', '#7209b7', '#2a9d8f'];

    function formatarDataChave(data) {
      const ano = data.getFullYear();
      const mes = String(data.getMonth() + 1).padStart(2, '0');
      const dia = String(data.getDate()).padStart(2, '0');
      return ano + '-' + mes + '-' + dia;
    }

    // Inicializa a data do primeiro acesso (dia na plataforma) se não existir
    if (!localStorage.getItem('app_primeiro_dia')) {
      localStorage.setItem('app_primeiro_dia', formatarDataChave(new Date()));
    }

    function salvarDados() {
      localStorage.setItem('app_habitos', JSON.stringify(habitos));
      localStorage.setItem('app_historico', JSON.stringify(historico));
    }

    function calcularDiasPlataforma() {
      const primeiroDiaStr = localStorage.getItem('app_primeiro_dia');
      if (!primeiroDiaStr) return 1;

      const partes = primeiroDiaStr.split('-').map(Number);
      const dataInicio = new Date(partes[0], partes[1] - 1, partes[2]);
      dataInicio.setHours(0, 0, 0, 0);

      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);

      const diffTempo = hoje - dataInicio;
      const diffDias = Math.round(diffTempo / (1000 * 60 * 60 * 24));
      return Math.max(1, diffDias + 1);
    }

    function calcularSequenciaAtual() {
      if (habitos.length === 0) return 0;

      let streak = 0;
      let dataCheck = new Date();
      dataCheck.setHours(0,0,0,0);

      const chaveHoje = formatarDataChave(dataCheck);
      const concluidosHoje = (historico[chaveHoje] || []).filter(function(id) {
        return habitos.some(function(h) { return h.id === id; });
      }).length;
      const hojeCompleto = (concluidosHoje === habitos.length);

      if (hojeCompleto) {
        streak++;
        dataCheck.setDate(dataCheck.getDate() - 1);
      } else {
        const ontem = new Date(dataCheck);
        ontem.setDate(ontem.getDate() - 1);
        const chaveOntem = formatarDataChave(ontem);
        const concluidosOntem = (historico[chaveOntem] || []).filter(function(id) {
          return habitos.some(function(h) { return h.id === id; });
        }).length;

        if (concluidosOntem === habitos.length && habitos.length > 0) {
          dataCheck = ontem;
        } else {
          return 0;
        }
      }

      while (true) {
        const chave = formatarDataChave(dataCheck);
        const concluidos = (historico[chave] || []).filter(function(id) {
          return habitos.some(function(h) { return h.id === id; });
        }).length;

        if (habitos.length > 0 && concluidos === habitos.length) {
          streak++;
          dataCheck.setDate(dataCheck.getDate() - 1);
        } else {
          break;
        }
      }

      return streak;
    }

    function renderizarGraficoBarrasSemana() {
      gradeBarras.innerHTML = '';
      
      const d = new Date(dataCentralSemanaBarras);
      const diaSemana = d.getDay();
      const diffParaSegunda = d.getDate() - (diaSemana === 0 ? 6 : diaSemana - 1);

      const inicioSemana = new Date(d.getFullYear(), d.getMonth(), diffParaSegunda);
      const fimSemana = new Date(d.getFullYear(), d.getMonth(), diffParaSegunda + 6);

      subtituloSemanaGrafico.textContent = inicioSemana.getDate() + '/' + (inicioSemana.getMonth() + 1) + ' até ' + fimSemana.getDate() + '/' + (fimSemana.getMonth() + 1);

      const contagemDias = [];
      let maxVal = habitos.length > 0 ? habitos.length : 5;

      for (let i = 0; i < 7; i++) {
        const diaTemp = new Date(d.getFullYear(), d.getMonth(), diffParaSegunda + i);
        const chaveDia = formatarDataChave(diaTemp);
        const concluidos = (historico[chaveDia] || []).filter(function(id) {
          return habitos.some(function(h) { return h.id === id; });
        }).length;

        if (concluidos > maxVal) maxVal = concluidos;

        contagemDias.push({
          data: diaTemp,
          concluidos: concluidos
        });
      }

      eixoY.innerHTML = `
        <span>${maxVal}</span>
        <span>${Math.round(maxVal * 0.66)}</span>
        <span>${Math.round(maxVal * 0.33)}</span>
        <span>0</span>
      `;

      for (let i = 0; i < 7; i++) {
        const item = contagemDias[i];
        const pctAltura = maxVal === 0 ? 0 : (item.concluidos / maxVal) * 100;

        const colDiv = document.createElement('div');
        colDiv.className = 'coluna-barra-item';

        const barraDiv = document.createElement('div');
        barraDiv.className = 'barra-cor';
        barraDiv.style.backgroundColor = coresBarras[i];
        barraDiv.style.height = (pctAltura > 0 ? pctAltura : 1) + '%';
        barraDiv.title = item.concluidos + ' hábitos';

        const rotuloDiv = document.createElement('div');
        rotuloDiv.className = 'rotulo-data-barra';
        rotuloDiv.textContent = item.data.getDate() + '/' + (item.data.getMonth() + 1);

        colDiv.appendChild(barraDiv);
        colDiv.appendChild(rotuloDiv);

        gradeBarras.appendChild(colDiv);
      }
    }

    function atualizarEstatisticasEGrafico() {
      const totalHabitos = habitos.length;
      const dataChave = formatarDataChave(dataCentral);

      const concluidosDia = (historico[dataChave] || []).filter(function(id) {
        return habitos.some(function(h) { return h.id === id; });
      }).length;

      const pctDia = totalHabitos === 0 ? 0 : Math.round((concluidosDia / totalHabitos) * 100);
      spanPorcentagemDia.textContent = pctDia + '%';

      const d = new Date(dataCentral);
      const diaSemana = d.getDay();
      const diffParaSegunda = d.getDate() - (diaSemana === 0 ? 6 : diaSemana - 1);

      let totalConcluidosSemana = 0;
      for (let i = 0; i < 7; i++) {
        const diaTemp = new Date(d.getFullYear(), d.getMonth(), diffParaSegunda + i);
        const chaveDia = formatarDataChave(diaTemp);
        const concluidosNoDia = (historico[chaveDia] || []).filter(function(id) {
          return habitos.some(function(h) { return h.id === id; });
        }).length;
        totalConcluidosSemana += concluidosNoDia;
      }

      const totalPossivelSemana = totalHabitos * 7;
      const pctSemana = totalPossivelSemana === 0 ? 0 : Math.round((totalConcluidosSemana / totalPossivelSemana) * 100);
      spanPorcentagemSemana.textContent = pctSemana + '%';

      const sequencia = calcularSequenciaAtual();
      spanValorSequencia.textContent = sequencia + (sequencia === 1 ? ' dia' : ' dias');

      const diasPlat = calcularDiasPlataforma();
      spanValorPlataforma.textContent = diasPlat + (diasPlat === 1 ? ' dia' : ' dias');

      renderizarGraficoMes();
      renderizarGraficoBarrasSemana();
    }

    function renderizarGraficoMes() {
      gradeMes.innerHTML = '';
      const ano = dataCentral.getFullYear();
      const mes = dataCentral.getMonth();

      const nomeMes = dataCentral.toLocaleDateString('pt-BR', { month: 'long' });
      subtituloMesGrafico.textContent = 'Histórico de ' + nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1);

      const totalDiasNoMes = new Date(ano, mes + 1, 0).getDate();
      const totalHabitos = habitos.length;

      for (let dia = 1; dia <= totalDiasNoMes; dia++) {
        const dataDia = new Date(ano, mes, dia);
        const chave = formatarDataChave(dataDia);

        const concluidos = (historico[chave] || []).filter(function(id) {
          return habitos.some(function(h) { return h.id === id; });
        }).length;

        const pct = totalHabitos === 0 ? 0 : Math.round((concluidos / totalHabitos) * 100);

        const circulo = document.createElement('div');
        circulo.className = 'circulo-dia';

        if (chave === formatarDataChave(dataCentral)) {
          circulo.classList.add('selecionado');
        }

        if (pct === 100 && totalHabitos > 0) {
          circulo.classList.add('completo');
        } else {
          circulo.style.background = 'conic-gradient(var(--cor-verde) ' + pct + '%, #2a2a2a ' + pct + '%)';
        }

        const inner = document.createElement('div');
        inner.className = 'circulo-dia-inner';
        inner.textContent = dia;

        circulo.appendChild(inner);

        circulo.addEventListener('click', function() {
          dataCentral = dataDia;
          atualizarTudo();
        });

        gradeMes.appendChild(circulo);
      }
    }

    function renderizarCalendario() {
      diasSemanaContainer.innerHTML = '';

      for (let offset = -3; offset <= 3; offset++) {
        const diaTemp = new Date(dataCentral);
        diaTemp.setDate(dataCentral.getDate() + offset);

        const diaItem = document.createElement('div');
        diaItem.className = 'dia-item ' + (offset === 0 ? 'ativo' : '');
        
        diaItem.innerHTML = `
          <span class="nome-dia">${nomesDias[diaTemp.getDay()]}</span>
          <span class="num-dia">${diaTemp.getDate()}</span>
        `;

        diaItem.addEventListener('click', function() {
          dataCentral = diaTemp;
          atualizarTudo();
        });

        diasSemanaContainer.appendChild(diaItem);
      }

      const opcoesData = { month: 'long', year: 'numeric' };
      textoDataAtual.textContent = dataCentral.toLocaleDateString('pt-BR', opcoesData);
    }

    function renderizarHabitos() {
      lista.innerHTML = '';
      const dataChave = formatarDataChave(dataCentral);

      if (habitos.length === 0) {
        lista.appendChild(mensagemVazia);
        mensagemVazia.style.display = 'block';
        atualizarEstatisticasEGrafico();
        return;
      }

      mensagemVazia.style.display = 'none';
      const concluidosNaData = historico[dataChave] || [];

      for (let i = 0; i < habitos.length; i++) {
        const habito = habitos[i];
        const estaConcluido = concluidosNaData.indexOf(habito.id) !== -1;

        const cartao = document.createElement('div');
        cartao.className = 'cartao-habito ' + (estaConcluido ? 'concluido' : '');
        cartao.innerHTML = `
          <div class="info-habito">
            <h3>${habito.nome}</h3>
          </div>
          <div class="acoes-habito">
            <button class="btn-concluir" title="Marcar/Desmarcar">${estaConcluido ? '✓' : ''}</button>
            <button class="btn-remover" title="Remover hábito">🗑</button>
          </div>
        `;

        const btnConcluir = cartao.querySelector('.btn-concluir');
        btnConcluir.addEventListener('click', function() {
          if (!historico[dataChave]) {
            historico[dataChave] = [];
          }

          const index = historico[dataChave].indexOf(habito.id);

          if (index > -1) {
            historico[dataChave].splice(index, 1);
          } else {
            historico[dataChave].push(habito.id);
          }

          salvarDados();
          renderizarHabitos();
        });

        const btnRemover = cartao.querySelector('.btn-remover');
        btnRemover.addEventListener('click', function() {
          const confirmar = confirm(`Tem certeza que deseja apagar o hábito "${habito.nome}"?`);
          
          if (confirmar) {
            const idParaRemover = habito.id;
            
            habitos = habitos.filter(function(item) {
              return item.id !== idParaRemover;
            });
            
            const datas = Object.keys(historico);
            for (let j = 0; j < datas.length; j++) {
              const d = datas[j];
              historico[d] = historico[d].filter(function(id) {
                return id !== idParaRemover;
              });
            }

            salvarDados();
            renderizarHabitos();
          }
        });

        lista.appendChild(cartao);
      }

      atualizarEstatisticasEGrafico();
    }

    function atualizarTudo() {
      renderizarCalendario();
      renderizarHabitos();
    }

    btnSemanaAnterior.addEventListener('click', function() {
      dataCentralSemanaBarras.setDate(dataCentralSemanaBarras.getDate() - 7);
      renderizarGraficoBarrasSemana();
    });

    btnSemanaProxima.addEventListener('click', function() {
      dataCentralSemanaBarras.setDate(dataCentralSemanaBarras.getDate() + 7);
      renderizarGraficoBarrasSemana();
    });

    btnAnterior.addEventListener('click', function() {
      dataCentral.setDate(dataCentral.getDate() - 1);
      atualizarTudo();
    });

    btnProximo.addEventListener('click', function() {
      dataCentral.setDate(dataCentral.getDate() + 1);
      atualizarTudo();
    });

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const nome = input.value.trim();

      if (nome !== '') {
        const novoHabito = {
          id: Date.now(),
          nome: nome
        };

        habitos.push(novoHabito);
        salvarDados();
        renderizarHabitos();
        input.value = '';
      }
    });

    atualizarTudo();
  </script>

</body>
</html>
